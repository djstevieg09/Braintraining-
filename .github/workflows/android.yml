name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrainBlitz-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BrainBlitz-test-apk
          path: BrainBlitz-test.apk
      - name: Publish to the "test-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: BrainBlitz test build
          prerelease: true
          body: Latest test APK built from ${{ github.sha }}. Download BrainBlitz-test.apk on your Android phone and open it to install.
          files: BrainBlitz-test.apk
